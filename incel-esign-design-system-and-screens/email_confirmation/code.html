<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fbf8fc;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .float-animation {
            animation: float 4s ease-in-out infinite;
        }
    </style>

<body class="flex items-center justify-center min-h-screen p-6 relative overflow-hidden">
<!-- Background Texture -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-40">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-secondary opacity-10 blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-primary opacity-5 blur-[120px]"></div>
</div>
<!-- Main Content Canvas -->
<main class="w-full max-w-md z-10">
<!-- Logo Branding -->
<div class="flex justify-center mb-8">
<div class="flex items-center gap-2">
<div class="w-10 h-10 bg-primary flex items-center justify-center rounded-xl shadow-lg">
<span class="material-symbols-outlined text-on-primary" style="font-variation-settings: 'FILL' 1;">gesture</span>
</div>
<div class="flex flex-col">
<span class="font-headline-lg text-headline-lg text-primary tracking-tight">Incel E-Sign</span>
<span class="font-label-xs text-label-xs text-muted uppercase tracking-widest">Legal Authority</span>
</div>
</div>
</div>
<!-- Confirmation Card -->
<div class="glass-card shadow-xl rounded-xl p-8 text-center flex flex-col items-center">
<!-- Illustration Area -->
<div class="relative w-32 h-32 mb-6 flex items-center justify-center">
<div class="absolute inset-0 bg-secondary-container opacity-20 rounded-full float-animation"></div>
<div class="relative z-10 w-24 h-24 bg-white rounded-full shadow-md flex items-center justify-center">
<span class="material-symbols-outlined text-[48px] text-status-your-turn" style="font-variation-settings: 'FILL' 0;">mail</span>
</div>
<!-- Decorative Elements -->
<div class="absolute top-0 right-0 w-4 h-4 bg-status-completed rounded-full"></div>
<div class="absolute bottom-4 left-0 w-3 h-3 bg-secondary rounded-full opacity-60"></div>
</div>
<!-- Content Header -->
<h1 class="font-headline-xl text-headline-xl text-primary mb-2">Check your email</h1>
<p class="font-body-base text-body-base text-on-surface-variant mb-8 px-2">
                We sent a confirmation link to <span class="font-bold text-primary">alex@example.com</span>. Please click the link to verify your account.
            </p>
<!-- Action Buttons -->
<div class="w-full space-y-4">
<button class="w-full py-4 bg-primary text-on-primary rounded-lg font-label-sm text-label-sm transition-all hover:bg-primary-hover hover:shadow-lg focus:ring-2 focus:ring-status-your-turn active:opacity-90">
                    Open Email Client
                </button>
<div class="pt-4 border-t border-border flex flex-col gap-3">
<button class="flex items-center justify-center gap-2 text-status-your-turn font-label-sm text-label-sm hover:underline py-2">
<span class="material-symbols-outlined text-[18px]">refresh</span>
                        Resend link
                    </button>
<button class="text-muted font-label-sm text-label-sm hover:text-primary transition-colors py-2 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]">arrow_back</span>
                        Back to login
                    </button>
</div>
</div>
</div>
<!-- Support Text -->
<div class="mt-8 text-center">
<p class="font-caption-xs text-caption-xs text-muted">
                Didn't receive the email? Check your spam folder or <a class="text-status-your-turn underline" href="#">contact support</a>.
            </p>
</div>
</main>
<!-- Footer Identity (Discrete) -->
<footer class="absolute bottom-6 w-full text-center px-4">
<div class="max-w-content-width mx-auto flex justify-center items-center gap-6 opacity-40">
<span class="font-label-xs text-label-xs text-primary">Secure 256-bit AES Encryption</span>
<span class="w-1 h-1 bg-primary rounded-full"></span>
<span class="font-label-xs text-label-xs text-primary">SOC2 Compliant</span>
<span class="w-1 h-1 bg-primary rounded-full"></span>
<span class="font-label-xs text-label-xs text-primary">eIDAS Certified</span>
</div>
</footer>
<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const resendBtn = document.querySelector('button:contains("Resend link")') || document.querySelectorAll('button')[1];
            
            resendBtn.addEventListener('click', () => {
                const originalText = resendBtn.innerHTML;
                resendBtn.innerHTML = '<span class="material-symbols-outlined text-[18px] animate-spin">sync</span> Sending...';
                resendBtn.disabled = true;
                resendBtn.style.opacity = '0.7';
                
                setTimeout(() => {
                    resendBtn.innerHTML = '<span class="material-symbols-outlined text-[18px] text-status-completed">check_circle</span> Email sent!';
                    resendBtn.classList.remove('text-status-your-turn');
                    resendBtn.classList.add('text-status-completed');
                    
                    setTimeout(() => {
                        resendBtn.innerHTML = originalText;
                        resendBtn.classList.remove('text-status-completed');
                        resendBtn.classList.add('text-status-your-turn');
                        resendBtn.disabled = false;
                        resendBtn.style.opacity = '1';
                    }, 3000);
                }, 1500);
            });
        });
    </script>
